name: garmin-sync-coros

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,8,21 * * *'
permissions:
  contents: read

concurrency:
  group: garmin-coros-sync
  cancel-in-progress: false

env:
  ## 佳明配置
  GARMIN_AUTH_DOMAIN: ${{ secrets.GARMIN_AUTH_DOMAIN }}
  GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  PYTHONPATH: ${{ github.workspace }}/scripts
  GARMIN_NEWEST_NUM: ${{ secrets.GARMIN_NEWEST_NUM }}

  ## Coros配置
  COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
  COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
          uv pip install -r requirements.txt
      - name: Restore sync progress
        id: sync_state
        uses: actions/cache/restore@v4
        with:
          path: db
          key: sync-db-v1-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sync-db-v1-${{ github.workflow }}-${{ github.ref_name }}-
      - name: Run Garmin Sync
        run: |
          python scripts/garmin/garmin_sync_coros.py
      - name: Save sync progress
        if: always() && steps.sync_state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: db
          key: ${{ steps.sync_state.outputs.cache-primary-key }}
