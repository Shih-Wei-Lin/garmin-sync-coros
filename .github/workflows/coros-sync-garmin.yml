name: coros-sync-garmin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,7,20 * * *'
permissions:
  contents: read

concurrency:
  group: garmin-coros-sync
  cancel-in-progress: false

env:
  ## 佳明配置
  GARMIN_AUTH_DOMAIN: ${{ secrets.GARMIN_AUTH_DOMAIN }}
  GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  PYTHONPATH: ${{ github.workspace }}/scripts

  ## Coros配置
  COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
  COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
  ### 按需选择，如果选择 garmin_to_coros 佳明同步高驰
  ### 如果选择 coros_to_garmin 高驰同步佳明
  RUN_TYPE: coros_to_garmin # garmin_to_coros 佳明同步高驰、 coros_to_garmin

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install dependencies
        run: |
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV
          uv pip install -r requirements.txt
      - name: Restore sync progress
        id: sync_state
        uses: actions/cache/restore@v4
        with:
          path: db
          key: sync-db-v1-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sync-db-v1-${{ github.workflow }}-${{ github.ref_name }}-
      - name: Run Garmin Sync Coros
        if: env.RUN_TYPE == 'garmin_to_coros'
        run: |
          python scripts/garmin/garmin_sync_coros.py
      - name: Run Coros  Sync  Garmin
        if: env.RUN_TYPE == 'coros_to_garmin'
        run: |
          python scripts/coros/coros_sync_garmin.py
      - name: Save sync progress
        if: always() && steps.sync_state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: db
          key: ${{ steps.sync_state.outputs.cache-primary-key }}
